# Gestartet von make deploy, deploy-android und deploy-windows, siehe README.
name: Deploy

on:
  push:
    tags:
      - "web-v*"
      - "android-v*"
      - "windows-v*"
      - "website-v*"

env:
  IMAGE: ghcr.io/kinturas/kintura
  APP_URL: ${{ vars.APP_URL }}

jobs:
  web:
    if: startsWith(github.ref_name, 'web-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Version bestimmen
        run: |
          echo "VERSION=${GITHUB_REF_NAME##*-v}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ env.VERSION }}
            BUILD_NUMBER=${{ env.BUILD_NUMBER }}

  android:
    if: startsWith(github.ref_name, 'android-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Version bestimmen
        run: |
          build="${GITHUB_REF_NAME#*-v}"
          echo "VERSION=${build%-*}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${build##*-}" >> "$GITHUB_ENV"
      - name: APP_URL prüfen
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Die Repository-Variable APP_URL fehlt (Settings, Secrets and variables, Actions, Variables)."
            exit 1
          fi
      - name: Release-Schlüssel bereitstellen
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PROPERTIES" ]; then
            echo "::error::Die Secrets ANDROID_KEYSTORE_BASE64 und ANDROID_KEY_PROPERTIES fehlen, siehe README."
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          printf '%s\n' "$PROPERTIES" > "$RUNNER_TEMP/key.properties"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: apk
          secret-files: |
            android_keystore=${{ runner.temp }}/release.keystore
            android_key_properties=${{ runner.temp }}/key.properties
          outputs: type=local,dest=${{ runner.temp }}/apk
          build-args: |
            VERSION=${{ env.VERSION }}
            BUILD_NUMBER=${{ env.BUILD_NUMBER }}
            APP_URL=${{ env.APP_URL }}
      - name: APK als GitHub-Release veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/apk/kintura-$VERSION-$BUILD_NUMBER.apk" --title "Android $VERSION" --generate-notes

  windows:
    if: startsWith(github.ref_name, 'windows-v')
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Version bestimmen
        run: |
          build="${GITHUB_REF_NAME#*-v}"
          echo "VERSION=${build%-*}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${build##*-}" >> "$GITHUB_ENV"
      - name: APP_URL prüfen
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Die Repository-Variable APP_URL fehlt (Settings, Secrets and variables, Actions, Variables)."
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
      - name: Windows-App bauen
        working-directory: app
        run: flutter build windows --release --build-name="$VERSION" --build-number="$BUILD_NUMBER" --dart-define=APP_URL="$APP_URL"
      - name: Inno Setup installieren
        run: choco install innosetup --no-progress -y
      - name: Installer bauen
        shell: pwsh
        run: app/windows/build-installer.ps1 -Version $env:VERSION -Build $env:BUILD_NUMBER
      - name: Als GitHub-Release veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "builds/kintura-$VERSION-$BUILD_NUMBER-windows-setup.exe" --title "Windows $VERSION" --generate-notes

  # Baut website/ als nginx-Image. Läuft auch nach jedem App-Release, damit releases.json im
  # Image und damit die Download-Links aktuell bleiben. Impressum und Datenschutz kommen erst
  # beim Start des Containers dazu, siehe website/content-from-env.sh.
  website:
    needs: [android, windows]
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') && !startsWith(github.ref_name, 'web-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      WEBSITE_IMAGE: ghcr.io/kinturas/kintura-website
      REPO_URL: ${{ vars.REPO_URL || format('{0}/{1}', github.server_url, github.repository) }}
    steps:
      - uses: actions/checkout@v7
      - name: Repository-Variablen prüfen
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Die Repository-Variable APP_URL fehlt (Settings, Secrets and variables, Actions, Variables)."
            exit 1
          fi
      # Eine Versionsnummer gibt es nur bei website-v..., nach einem App-Release nur :latest.
      - name: Tags bestimmen
        run: |
          tags="$WEBSITE_IMAGE:latest"
          case "$GITHUB_REF_NAME" in
            website-v*) tags="$tags,$WEBSITE_IMAGE:${GITHUB_REF_NAME#website-v}" ;;
          esac
          echo "TAGS=$tags" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: website
          push: true
          tags: ${{ env.TAGS }}
          build-args: |
            APP_URL=${{ env.APP_URL }}
            REPO_URL=${{ env.REPO_URL }}
