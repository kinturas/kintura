# Gestartet von make deploy (Tag v1.2.3) und make deploy-website (Tag website-v…), siehe README.
#
# Ein Release v1.2.3 enthält alles: das Docker-Image mit Backend und Web-App, die APK und den
# Windows-Installer. Es entsteht als Entwurf, die Builds laden ihre Dateien hoch, und erst
# wenn alle fertig sind, wird es veröffentlicht. Entwürfe sieht die App nicht, so meldet sie
# nie ein Update, dessen Datei noch fehlt. Schlägt ein Build fehl, bleibt der Entwurf liegen;
# "Re-run failed jobs" macht dort weiter.
name: Deploy

on:
  push:
    tags:
      - "v*"
      - "website-v*"

env:
  IMAGE: ghcr.io/kinturas/kintura
  APP_URL: ${{ vars.APP_URL }}

jobs:
  prepare:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Eine Build-Nummer für alle Plattformen: die Zahl der Commits. Sie steigt immer, das
      # braucht Android, das kein Update mit kleinerer Nummer annimmt.
      - name: Version bestimmen
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      - name: Repository-Variablen prüfen
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Die Repository-Variable APP_URL fehlt (Settings, Secrets and variables, Actions, Variables)."
            exit 1
          fi
      - name: Release als Entwurf anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Bei einem erneuten Lauf gibt es ihn schon.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then exit 0; fi
          # Die Notizen seit dem letzten Release, vor den Tags v… war das web-v….
          previous="$(git tag --list 'v*' 'web-v*' --sort=-creatordate | grep -vx "$GITHUB_REF_NAME" | head -1 || true)"
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes \
            ${previous:+--notes-start-tag "$previous"}

  web:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ env.VERSION }}
            BUILD_NUMBER=${{ env.BUILD_NUMBER }}

  android:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - name: Release-Schlüssel bereitstellen
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PROPERTIES" ]; then
            echo "::error::Die Secrets ANDROID_KEYSTORE_BASE64 und ANDROID_KEY_PROPERTIES fehlen, siehe README."
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          printf '%s\n' "$PROPERTIES" > "$RUNNER_TEMP/key.properties"
      - name: Firebase-Einstellungen bereitstellen
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Ohne das Secret baut die App ohne Push-Nachrichten.
          if [ -z "$GOOGLE_SERVICES" ]; then
            echo "::warning::Das Secret GOOGLE_SERVICES_JSON fehlt: die App kommt ohne Push-Nachrichten, siehe README."
            exit 0
          fi
          printf '%s\n' "$GOOGLE_SERVICES" > "$RUNNER_TEMP/google-services.json"
          echo "GOOGLE_SERVICES_SECRET=google_services=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: apk
          secret-files: |
            android_keystore=${{ runner.temp }}/release.keystore
            android_key_properties=${{ runner.temp }}/key.properties
            ${{ env.GOOGLE_SERVICES_SECRET }}
          outputs: type=local,dest=${{ runner.temp }}/apk
          build-args: |
            VERSION=${{ env.VERSION }}
            BUILD_NUMBER=${{ env.BUILD_NUMBER }}
            APP_URL=${{ env.APP_URL }}
      # Der Name endet auf .apk, daran erkennen App und Website die Datei.
      - name: APK zum Release hochladen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "$RUNNER_TEMP/apk/kintura-$VERSION-$BUILD_NUMBER.apk" "$RUNNER_TEMP/kintura-$VERSION.apk"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/kintura-$VERSION.apk" --clobber

  windows:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
      - name: Windows-App bauen
        working-directory: app
        run: flutter build windows --release --build-name="$VERSION" --build-number="$BUILD_NUMBER" --dart-define=APP_URL="$APP_URL"
      - name: Inno Setup installieren
        run: choco install innosetup --no-progress -y
      - name: Installer bauen
        shell: pwsh
        run: app/windows/build-installer.ps1 -Version $env:VERSION -Build $env:BUILD_NUMBER
      # Der Name endet auf -windows-setup.exe, daran erkennen App und Website die Datei.
      - name: Installer zum Release hochladen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "builds/kintura-$VERSION-$BUILD_NUMBER-windows-setup.exe" "builds/kintura-$VERSION-windows-setup.exe"
          gh release upload "$GITHUB_REF_NAME" "builds/kintura-$VERSION-windows-setup.exe" --clobber

  publish:
    needs: [web, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  # Baut website/ als nginx-Image, nach jedem Release und bei website-v… allein. releases.json
  # für die Download-Links entsteht hier aus den veröffentlichten Releases. Impressum und
  # Datenschutz kommen erst beim Start des Containers dazu, siehe website/content-from-env.sh.
  website:
    needs: publish
    if: >-
      !cancelled() && (needs.publish.result == 'success' || startsWith(github.ref_name, 'website-v'))
    runs-on: ubuntu-latest
    # One build at a time; a waiting one replaces an older waiting one, both push :latest.
    concurrency:
      group: website
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      WEBSITE_IMAGE: ghcr.io/kinturas/kintura-website
      REPO_URL: ${{ vars.REPO_URL || format('{0}/{1}', github.server_url, github.repository) }}
    steps:
      - uses: actions/checkout@v7
      - name: Repository-Variablen prüfen
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Die Repository-Variable APP_URL fehlt (Settings, Secrets and variables, Actions, Variables)."
            exit 1
          fi
      - name: releases.json aus den Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -s '[.[][] | select((.draft or .prerelease) | not) | select(.assets | length > 0)
                      | {tag: .tag_name, published: .published_at, assets: [.assets[].name]}]' \
            > website/public/releases.json
          cat website/public/releases.json
      # Eine Versionsnummer gibt es nur bei website-v..., nach einem Release nur :latest.
      - name: Tags bestimmen
        run: |
          tags="$WEBSITE_IMAGE:latest"
          case "$GITHUB_REF_NAME" in
            website-v*) tags="$tags,$WEBSITE_IMAGE:${GITHUB_REF_NAME#website-v}" ;;
          esac
          echo "TAGS=$tags" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: website
          push: true
          tags: ${{ env.TAGS }}
          build-args: |
            APP_URL=${{ env.APP_URL }}
            REPO_URL=${{ env.REPO_URL }}
