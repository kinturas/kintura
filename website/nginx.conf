server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Keine IP-Adressen der Besucher speichern, siehe datenschutz.html.
    access_log off;
    error_log /dev/stderr crit;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # releases.json und index.html ändern sich mit jedem Deploy.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Impressum und Datenschutz, page.js zeigt sie an.
    location /content/ {
        types { }
        default_type "text/markdown; charset=utf-8";
        try_files $uri =404;
    }
}
